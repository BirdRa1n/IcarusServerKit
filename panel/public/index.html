<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Icarus Server Kit</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f2a541'/%3E%3Cpath d='M9 21l7-12 7 12z' fill='%230b0e12'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"><div class="planet"></div><div class="stars"></div><div class="stars s2"></div></div>

  <!-- login -->
  <section id="login" class="login" hidden>
    <form id="loginForm" class="login-card glass">
      <div class="brand brand-lg"><span class="brand-mark"></span><span>ICARUS</span><b>SERVER KIT</b></div>
      <label><span data-i18n="login.user"></span><input name="name" autocomplete="username" value="admin" required></label>
      <label><span data-i18n="login.password"></span><input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary lg" type="submit" data-i18n="login.submit"></button>
      <p id="loginError" class="form-error" role="alert"></p>
      <div class="login-foot"><select class="lang-select" aria-label="Language"></select></div>
    </form>
  </section>

  <!-- app -->
  <div id="app" class="app" hidden>
    <header class="topbar glass">
      <div class="brand"><span class="brand-mark"></span><span>ICARUS</span><b>SERVER KIT</b></div>
      <div class="chips">
        <span id="statusChip" class="chip-status off"><i class="live"></i><span></span></span>
        <span class="chip"><svg class="ic" data-icon="users"></svg><b id="statPlayers">0</b></span>
        <span class="chip"><svg class="ic" data-icon="map"></svg><b id="statMap">—</b></span>
        <span class="chip" id="chipHour" hidden><svg class="ic" data-icon="sun"></svg><b id="statHour"></b></span>
        <span class="chip"><svg class="ic" data-icon="clock"></svg><b id="statUptime">—</b></span>
        <span class="chip warn" id="chipCountdown" hidden><svg class="ic" data-icon="timer"></svg><b id="statCountdown"></b></span>
      </div>
      <div class="top-actions">
        <select class="lang-select" aria-label="Language"></select>
        <span class="user"><svg class="ic" data-icon="user"></svg><span id="userName"></span></span>
        <button id="logoutBtn" class="btn ghost sm" data-i18n="top.logout"></button>
      </div>
    </header>

    <main class="main">
      <section class="map-wrap">
        <div class="map-toolbar glass">
          <select id="mapSelect" aria-label="Map"></select>
          <label class="switch"><input type="checkbox" id="followMap" checked><i></i><span data-i18n="map.follow"></span></label>
          <span class="spacer"></span>
          <span id="cursorPos" class="mono muted"></span>
          <button id="zoomIn" class="btn icon ghost" aria-label="+"><svg class="ic" data-icon="plus"></svg></button>
          <button id="zoomOut" class="btn icon ghost" aria-label="-"><svg class="ic" data-icon="minus"></svg></button>
          <button id="zoomFit" class="btn icon ghost" data-i18n-title="map.fit"><svg class="ic" data-icon="fit"></svg></button>
        </div>
        <div id="map" class="map">
          <div id="mapLayer" class="map-layer"></div>
          <div id="markerLayer" class="marker-layer"></div>
          <div class="map-vignette" aria-hidden="true"></div>
        </div>
        <div id="mapMenu" class="ctx glass" hidden></div>
      </section>

      <aside class="side glass">
        <nav class="tabs" role="tablist">
          <button data-tab="players" class="active"><svg class="ic" data-icon="users"></svg><span data-i18n="tab.players"></span></button>
          <button data-tab="items"><svg class="ic" data-icon="box"></svg><span data-i18n="tab.items"></span></button>
          <button data-tab="creatures"><svg class="ic" data-icon="paw"></svg><span data-i18n="tab.creatures"></span></button>
          <button data-tab="world"><svg class="ic" data-icon="globe"></svg><span data-i18n="tab.world"></span></button>
          <button data-tab="rules"><svg class="ic" data-icon="shield"></svg><span data-i18n="tab.rules"></span></button>
          <button data-tab="log"><svg class="ic" data-icon="list"></svg><span data-i18n="tab.log"></span><i id="logBadge" class="badge" hidden>0</i></button>
          <span class="tab-ink" aria-hidden="true"></span>
        </nav>
        <div class="views">
          <section id="view-players" class="view active"></section>
          <section id="view-items" class="view"></section>
          <section id="view-creatures" class="view"></section>
          <section id="view-world" class="view"></section>
          <section id="view-rules" class="view"></section>
          <section id="view-log" class="view"></section>
        </div>
      </aside>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
